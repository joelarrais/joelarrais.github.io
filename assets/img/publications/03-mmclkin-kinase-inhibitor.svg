<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img">
  <title>Kinase and inhibitor encoders (3-D graph, ESM sequence model and SMILES language model) are aligned by contrastive attention to predict activity and selectivity. Mean absolute error 0.381, 16.3% lower than DrugBAN; selectivity correlation 0.898 across the kinome; best IC50 2.08 nM on the LRRK2 G2019S mutant.</title>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .node { fill: #f4f2fa; stroke: #e2ddf2; stroke-width: 1.5; }
    .node-accent { fill: #695aa6; }
    .label { fill: #262233; font-size: 28px; font-weight: 700; }
    .sub { fill: #6f6b80; font-size: 20px; }
    .on-accent { fill: #ffffff; }
    .sub-on-accent { fill: #e6e1f7; }
    .arrow { stroke: #9d93c9; stroke-width: 3; fill: none; }
    .loop { stroke-dasharray: 7 7; }
    .head { fill: #9d93c9; }
    .note { fill: #6f6b80; font-size: 18px; }
    .divider { stroke: #e7e4f0; stroke-width: 1.5; }
    .num { fill: #695aa6; font-size: 52px; font-weight: 700; }
    .cap { fill: #262233; font-size: 20px; font-weight: 600; }
    .cap2 { fill: #6f6b80; font-size: 18px; }
    .hl { fill: #e4def7; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #262234; stroke: #353049; }
      .node-accent { fill: #6f62b0; }
      .label, .cap { fill: #ece9f4; }
      .sub, .note, .cap2 { fill: #a7a3b6; }
      .sub-on-accent { fill: #ddd7f6; }
      .arrow { stroke: #7a70a8; }
      .head { fill: #7a70a8; }
      .divider { stroke: #2e2a3b; }
      .num { fill: #b4a8ee; }
      .hl { fill: #3a3358; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <!-- method: three steps -->
  <rect class="node" x="20" y="24" width="220" height="120" rx="18"/>
  <text class="t label" x="130" y="66" text-anchor="middle">Encoders</text>
  <text class="t sub" x="130" y="98" text-anchor="middle">kinase: graph + ESM</text>
  <text class="t sub" x="130" y="124" text-anchor="middle">inhibitor: SMILES</text>
  <rect class="node node-accent" x="290" y="24" width="220" height="120" rx="18"/>
  <text class="t label on-accent" x="400" y="66" text-anchor="middle">Contrastive</text>
  <text class="t sub sub-on-accent" x="400" y="98" text-anchor="middle">attention alignment</text>
  <text class="t sub sub-on-accent" x="400" y="124" text-anchor="middle">across modalities</text>
  <rect class="node" x="560" y="24" width="220" height="120" rx="18"/>
  <text class="t label" x="670" y="66" text-anchor="middle">Prediction</text>
  <text class="t sub" x="670" y="98" text-anchor="middle">activity and</text>
  <text class="t sub" x="670" y="124" text-anchor="middle">selectivity</text>
  <path class="arrow" d="M248 84 H280" marker-end="url(#arrow)"/>
  <path class="arrow" d="M518 84 H550" marker-end="url(#arrow)"/>
  <text class="t note" x="400" y="198" text-anchor="middle">benchmarks: 3DKDavis · 3DKKIBA · CASF-2016</text>
  <!-- key results -->
  <path class="divider" d="M20 222 H780"/>
  <text class="t num" x="146" y="296" text-anchor="middle">0.381</text>
  <text class="t cap" x="146" y="334" text-anchor="middle">mean absolute error</text>
  <text class="t cap2" x="146" y="360" text-anchor="middle">−16.3% vs DrugBAN</text>
  <text class="t num" x="400" y="296" text-anchor="middle">0.898</text>
  <text class="t cap" x="400" y="334" text-anchor="middle">selectivity correlation</text>
  <text class="t cap2" x="400" y="360" text-anchor="middle">across the kinome</text>
  <text class="t num" x="654" y="296" text-anchor="middle">2.08 nM</text>
  <text class="t cap" x="654" y="334" text-anchor="middle">best IC50 on</text>
  <text class="t cap2" x="654" y="360" text-anchor="middle">LRRK2 G2019S</text>
</svg>
