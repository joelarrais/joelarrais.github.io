<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img">
  <title>ABIET: a Transformer pre-trained on 1.18 million ChEMBL molecules turns attention into atom importance, and functional groups rank highest: 85.8% of molecules with standard SMILES and 93.3% with stereochemical SMILES.</title>
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .node { fill: #f4f2fa; stroke: #e2ddf2; stroke-width: 1.5; }
    .node-accent { fill: #695aa6; }
    .label { fill: #262233; font-size: 28px; font-weight: 700; }
    .sub { fill: #6f6b80; font-size: 20px; }
    .on-accent { fill: #ffffff; }
    .sub-on-accent { fill: #e6e1f7; }
    .arrow { stroke: #9d93c9; stroke-width: 3; fill: none; }
    .loop { stroke-dasharray: 7 7; }
    .head { fill: #9d93c9; }
    .note { fill: #6f6b80; font-size: 18px; }
    .divider { stroke: #e7e4f0; stroke-width: 1.5; }
    .num { fill: #695aa6; font-size: 52px; font-weight: 700; }
    .cap { fill: #262233; font-size: 20px; font-weight: 600; }
    .cap2 { fill: #6f6b80; font-size: 18px; }
    .hl { fill: #e4def7; }
    @media (prefers-color-scheme: dark) {
      .node { fill: #262234; stroke: #353049; }
      .node-accent { fill: #6f62b0; }
      .label, .cap { fill: #ece9f4; }
      .sub, .note, .cap2 { fill: #a7a3b6; }
      .sub-on-accent { fill: #ddd7f6; }
      .arrow { stroke: #7a70a8; }
      .head { fill: #7a70a8; }
      .divider { stroke: #2e2a3b; }
      .num { fill: #b4a8ee; }
      .hl { fill: #3a3358; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <!-- method: three steps -->
  <rect class="node" x="20" y="24" width="220" height="120" rx="18"/>
  <text class="t label" x="130" y="66" text-anchor="middle">Transformer</text>
  <text class="t sub" x="130" y="98" text-anchor="middle">pre-trained on</text>
  <text class="t sub" x="130" y="124" text-anchor="middle">ChEMBL SMILES</text>
  <rect class="node node-accent" x="290" y="24" width="220" height="120" rx="18"/>
  <text class="t label on-accent" x="400" y="66" text-anchor="middle">Attention</text>
  <text class="t sub sub-on-accent" x="400" y="98" text-anchor="middle">4 heads → atom</text>
  <text class="t sub sub-on-accent" x="400" y="124" text-anchor="middle">importance</text>
  <rect class="node" x="560" y="24" width="220" height="120" rx="18"/>
  <text class="t label" x="670" y="66" text-anchor="middle">Ranking</text>
  <text class="t sub" x="670" y="98" text-anchor="middle">functional groups</text>
  <text class="t sub" x="670" y="124" text-anchor="middle">rank highest</text>
  <path class="arrow" d="M248 84 H280" marker-end="url(#arrow)"/>
  <path class="arrow" d="M518 84 H550" marker-end="url(#arrow)"/>
  <!-- example: functional-group atoms highlighted in a SMILES string -->
  <rect class="hl" x="291.4" y="158" width="85.2" height="32" rx="7"/>
  <rect class="hl" x="449.8" y="158" width="19.2" height="32" rx="7"/>
  <text class="mono cap" x="400" y="181" text-anchor="middle" textLength="237.6">CC(=O)Nc1ccc(O)cc1</text>
  <text class="t note" x="400" y="210" text-anchor="middle">highlighted: functional-group (FG) atoms</text>
  <!-- key results -->
  <path class="divider" d="M20 222 H780"/>
  <text class="t num" x="146" y="296" text-anchor="middle">1.18 M</text>
  <text class="t cap" x="146" y="334" text-anchor="middle">ChEMBL molecules</text>
  <text class="t cap2" x="146" y="360" text-anchor="middle">for pre-training</text>
  <text class="t num" x="400" y="296" text-anchor="middle">85.8%</text>
  <text class="t cap" x="400" y="334" text-anchor="middle">FG-dominant molecules</text>
  <text class="t cap2" x="400" y="360" text-anchor="middle">standard SMILES</text>
  <text class="t num" x="654" y="296" text-anchor="middle">93.3%</text>
  <text class="t cap" x="654" y="334" text-anchor="middle">FG-dominant molecules</text>
  <text class="t cap2" x="654" y="360" text-anchor="middle">stereochemical SMILES</text>
</svg>
